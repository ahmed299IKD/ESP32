[env:esp32s3box]
; Recommended platform for the project
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Library dependencies (based on project requirements)
lib_deps = 
    https://github.com/me-no-dev/ESPAsyncWebServer.git#v3.0.0
    https://github.com/bblanchon/ArduinoJson.git#v7.0.0
    https://github.com/h2zero/NimBLE-Arduino.git
    ; Add other necessary libraries like LittleFS, ESP-NOW, etc.
    esp-now
    
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DARDUINOJSON_USE_LONG_LONG=1
    -std=c++17
    
; Partition scheme for large file system (for web assets)
board_build.partitions = default_16MB_no_ota.csv

; Monitor configuration
monitor_speed = 115200

[env:esp32c6]
; Future-ready platform with WiFi 6 and 802.15.4
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
; Note: Zigbee/Thread support typically requires ESP-IDF, not just Arduino framework.
; This configuration is a placeholder for PlatformIO compatibility.

